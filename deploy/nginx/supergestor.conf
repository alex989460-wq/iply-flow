# Nginx — mesmo domínio para o site, a API, a autenticação e as funções.
# Assim nenhum link, checkout ou webhook precisa mudar de endereço.

server {
    listen 80;
    server_name __DOMAIN__;

    client_max_body_size 50m;

    # Site (build estático)
    location / {
        root /opt/supergestor/app;
        try_files $uri $uri/ /index.html;
    }

    # API do banco, autenticação, storage, realtime e funções
    location ~ ^/(rest|auth|storage|realtime|functions)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Painel interno de administração do banco (restrito por IP)
    location /studio/ {
        allow 127.0.0.1;
        # allow SEU.IP.AQUI;
        deny all;
        proxy_pass http://127.0.0.1:8000/;
    }
}
